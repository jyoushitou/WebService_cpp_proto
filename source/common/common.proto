syntax = "proto3";

package common;

// 通用空消息
message Empty {}

message header
{
  uint32 MSGID  = 1;//消息ID
  uint64 MSGLen = 2;//消息长度
}

message error
{
  header head      = 3;//消息头部节点
  uint32 ServiceID = 4;//错误服务器ID
}

message goal
{
  header head          = 3;//消息头部节点
  uint32 ServiceGoalID = 4; //微服务目标ID
}