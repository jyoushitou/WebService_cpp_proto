syntax = "proto3";

package common;

// 通用空消息
message empty {}

//通用头节点
message header
{
  //消息ID
  uint64 MSGID = 1;
  //发送服务器ID
  int32 ServiceID = 2;
  //微服务目标ID
  int32 ServiceGoalID = 3;
}

//错误节点
message error
{
  //消息头部节点
  header head = 1;
  //错误信息
  string msg = 2;
}

//一般消息节点
message logs
{
  //消息头部节点
  header head = 1;
  //消息
  string msg = 2;
}